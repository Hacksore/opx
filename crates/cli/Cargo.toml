[package]
name = "opx"
description = "Enhance 1password secret expansion with the opx CLI"
license = "MIT"
version = "0.0.8"
edition = "2021"
rust-version = "1.71"
readme = "README.md"
repository = "https://github.com/Hacksore/opx"


[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.103"
dirs = "6.0.0"
serde_json = "1.0.150"
shell-words = "1.1.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
tempfile = "3.23.0"

[[bin]]
name = "opx"
path = "src/main.rs"
